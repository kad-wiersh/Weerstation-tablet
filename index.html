<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1220">
<title>Weerstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220;   /* deep, near-black blue, commonly known as Chinese Black or an "Arabian Nights" dark navy */
    --cloud:#F4F7FA; /* very light, desaturated blue-gray often called Alice Blue or "Porcelain White" */
    --muted:#93A2BE; /* dusty, unsaturated shade of light blue */
    --gold:#F5B942;  /* bright, warm neon-style yellow-orange with a cream-like tone */
    --coral:#FF8A5B; /* vibrant, light orange often referred to as "Glossy Coral" or a warm, mellow peach */
    --red:#FF0000;
    --green:#00FF00;
    --line: rgba(244,247,250,0.16);  /* off-white/light gray with an alpha transparency of 16% */
    --panel: rgba(244,247,250,0.06); /* off-white/light gray with an alpha transparency of 6% */
    --bg-a: #0B1220;
    --bg-b: #1B2A4A;
    --transition-bg: background 1.4s ease;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden; overscroll-behavior:none; user-select:none;
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
    transition: var(--transition-bg);
    color: var(--cloud);
    font-family:'Inter', system-ui, sans-serif;
  }
  #stars{position:fixed; inset:0; z-index:0; opacity:0; transition:opacity 1.4s ease; pointer-events:none;}
  .app{
    position:relative; z-index:1;
    height:100%; width:100%;
    display:flex; flex-direction:column;
    padding: 3.2vh 3.4vw 2vh 3.4vw;
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex; justify-content:space-between; align-items:flex-start;}
  .place{
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size: clamp(16px, 2vw, 24px); letter-spacing:.02em;
    color: var(--cloud); opacity:.92;
  }
  .place small{
    display:block; font-family:'IBM Plex Mono', monospace; font-weight:400;
    font-size: clamp(10px,1.1vw,13px); color: var(--cloud); letter-spacing:.08em; margin-top:2px;}
  /* .clockwrap{text-align:right;} */
  .clock{
    font-family:'IBM Plex Mono', monospace; font-weight:500;
    font-size: clamp(28px, 4.4vw, 56px); line-height:1; letter-spacing:.01em;
  }
  .clock span{color:var(--gold);}
  .date{
    font-family:'Inter', sans-serif; font-size: clamp(16px,2vw,24px);
    color:var(--cloud); margin-top:4px; text-transform:capitalize;
  }
  .updated{
    font-family:'IBM Plex Mono'; font-size:clamp(16px, 2vw, 24px); color:var(--green);
    text-align:center;
    }
  .updated.offline{color:var(--red);}
  /*
  .iconbtn{
    background:var(--panel); border:1px solid var(--cloud); border-radius:10px;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    color:var(--cloud); cursor:pointer;
  }
  .iconbtn svg{width:16px; height:16px;}
  */
  .btn-group {
    /*position: fixed;*/
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eee;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover {
    background: #ddd;
  }
  .icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: #333;
  }

  /* ---------- middle: sun arc + current ---------- */
  .mid{flex:1; display:flex; align-items:center; gap:4vw; min-height:0;}
  .arcbox{flex:0 0 34%; max-width:420px; display:flex; flex-direction:column; align-items:center;}
  .arcbox svg{width:100%; height:auto; overflow:visible;}
  .arc-times{display:flex; justify-content:space-between; width:88%; margin-top:-6px;
    font-family:'IBM Plex Mono', monospace; font-size:clamp(10px,1.15vw,14px); color:var(--cloud);}
  .arc-label{font-family:'Inter'; font-size:clamp(10px,1vw,12px); color:var(--cloud); margin-top:10px; letter-spacing:.05em;}

  .current{flex:1; display:flex; align-items:center; gap:3vw; min-width:0;}
  .cur-icon{flex:0 0 auto; width:clamp(70px,9vw,120px); height:clamp(70px,9vw,120px); color:var(--gold);}
  .cur-desc{font-family:'Space Grotesk'; font-weight:500; font-size:clamp(15px,1.8vw,22px); margin-top:2px;}
  .cur-main{min-width:0;}
  .cur-temp{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size: clamp(52px, 9vw, 128px); line-height:1; letter-spacing:-.01em;
    display:flex; align-items:flex-start;
  }
  .cur-temp sup{font-size:.35em; font-weight:500; margin-top:.15em; color:var(--cloud);}
  .cur-feels{font-family:'Inter'; font-size:clamp(16px,1.2vw,18px); color:var(--cloud); margin-top:2px;}

  .details{flex:0 0 auto; display:grid; grid-template-columns:1fr; gap:10px; min-width:150px;}
  .det{display:flex; align-items:center; gap:10px;}
  .det svg{width:clamp(16px,1.8vw,22px); height:clamp(16px,1.8vw,22px); color:var(--cloud); flex:0 0 auto;}
  .det-val{font-family:'IBM Plex Mono', monospace; font-size:clamp(13px,1.4vw,17px);}
  .det-sub{font-family:'Inter'; font-size:clamp(9px,0.9vw,11px); color:var(--cloud); display:block;}

  /* ---------- hourly strip ---------- */
  .hourly{
    display:flex; gap: clamp(10px,1.6vw,22px); overflow-x:auto; padding: 14px 4px 10px 4px;
    border-top:1px solid var(--line); margin-top:1vh;
    -webkit-overflow-scrolling:touch;
  }
  .hourly::-webkit-scrollbar{height:0;}
  .hr{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:48px;}
  .hr-t{font-family:'IBM Plex Mono'; font-size:clamp(10px,1vw,12px); color:var(--cloud);}
  .hr-icon{width:clamp(20px,2.2vw,28px); height:clamp(20px,2.2vw,28px); color:var(--cloud); opacity:.85;}
  .hr-temp{font-family:'Space Grotesk'; font-weight:600; font-size:clamp(13px,1.3vw,16px);}
  .hr-pop{font-family:'IBM Plex Mono'; font-size:clamp(9px,0.85vw,11px); color:var(--cloud);}

  /* ---------- daily row ---------- */
  .daily{display:flex; justify-content:space-between; gap: clamp(6px,1vw,14px); padding-top:12px; border-top:1px solid var(--line); margin-top:8px;}
  .dy{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; border-radius:14px; background:var(--panel);}
  .dy-name{font-family:'Space Grotesk'; font-weight:600; font-size:clamp(11px,1.1vw,14px); text-transform:capitalize;}
  .dy-icon{width:clamp(20px,2.4vw,30px); height:clamp(20px,2.4vw,30px); color:var(--gold); margin:2px 0;}
  .dy-range{font-family:'IBM Plex Mono'; font-size:clamp(10px,1vw,13px); display:flex; gap:6px;}
  .dy-range .lo{color:var(--gold);}
  .dy-pop{font-family:'IBM Plex Mono'; font-size:clamp(9px,0.85vw,11px); color:var(--cloud);}

  .chartwrap{
    flex:1; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding: 1.4vh 0;
  }
  .chartwrap::-webkit-scrollbar{height:6px;}
  .chartwrap::-webkit-scrollbar-thumb{background:var(--panel); border-radius:6px;}
  svg#chart text{font-family:'IBM Plex Mono', monospace; fill:var(--cloud);}
  svg#chart .daylabel{font-family:'Space Grotesk', sans-serif; font-weight:600; fill:var(--cloud);}
  svg#chart .datelabel{fill:var(--cloud); font-size:11px;}

  /* ---------- footer ---------- */
  /*
  .footer{display:flex; justify-content:space-between; align-items:center; margin-top:10px; opacity:.7;}
  .footer-right{display:flex; gap:8px;}
  */
  
  /* ---------- settings panel ---------- */
  /*
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:5; display:none; align-items:center; justify-content:center;}
  .overlay.show{display:flex;}
  .panel{
    background:#101a30; border:1px solid var(--line); border-radius:18px; padding:24px 26px;
    width:min(90vw, 380px); font-family:'Inter';
  }
  .panel h3{font-family:'Space Grotesk'; margin:0 0 14px 0; font-size:18px;}
  .panel label{display:block; font-size:12px; color:var(--muted); margin:12px 0 4px;}
  .panel input{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:#0B1220; color:var(--cloud); font-family:'IBM Plex Mono'; font-size:14px;
  }
  .panel-btns{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; padding:10px; border-radius:9px; border:none; font-family:'Space Grotesk'; font-weight:600; cursor:pointer; font-size:14px;}
  .btn.primary{background:var(--gold); color:#1a1300;}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .hint{font-size:11px; color:var(--muted); margin-top:14px; line-height:1.5;}
  */
  .tapfs{position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); color:var(--cloud); font-family:'Space Grotesk'; font-size:16px; text-align:center; padding:20px;}
  .tapfs.hide{display:none;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">

  <div class="topbar">
    <div class="place">
      <span id="placeName">Plaats</span>
      <small id="coords">Coordinaten</small>
    </div>
    <div class="date" id="dateStr">Datum</div>
    <!-- <div class="clockwrap"> -->
      <div class="clock" id="clock">--<span>:</span>--</div>
      <!-- <div class="date" id="dateStr">-</div> -->
    <!-- </div> -->
    <div id="updated" class="updated">
      <span id="updatedText">Status</span><br>
      <span id="updatedDate">Onbekend</span>
    </div>
    
    <div class="btn-group">
      <div class="icon-btn" id="refDataBtn" title="Refetch data">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="icon-btn" id="relPageBtn" title="Reload page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4v5h5" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 20v-5h-5" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 15a8 8 0 0014.9 2.5M19.5 9a8 8 0 00-14.9-2.5" stroke="black" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="icon-btn" id="fsBtn" title="Volledig scherm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="mid">
    <div class="arcbox">
      <svg viewBox="0 0 300 170" id="arcSvg">
        <path d="M20,140 A130,130 0 0 1 280,140" fill="none" stroke="rgba(244,247,250,0.18)" stroke-width="2" stroke-linecap="round"/>
        <circle id="arcDot" cx="20" cy="140" r="7" fill="#F5B942"/>
      </svg>
      <div class="arc-times">
        <span id="sunriseT">--:--</span>
        <span id="sunsetT">--:--</span>
      </div>
      <div class="arc-label" id="arcLabel">daglicht</div>
    </div>

    <div class="current">
      <div class="cur-kind">
        <div class="cur-icon" id="curIcon"></div>
        <div class="cur-desc" id="curDesc">Laden…</div>
      </div>
      <div class="cur-main">
        <div class="cur-temp" id="curTemp">--<sup>°C</sup></div>
        <!-- <div class="cur-desc" id="curDesc">Laden…</div> -->
        <div class="cur-feels" id="curFeels">Voelt als --°</div>
      </div>
      <div class="details">
        <div class="det">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2s7 8.5 7 13a7 7 0 1 1-14 0c0-4.5 7-13 7-13z"/>
          </svg>
          <div>
            <span class="det-val" id="detHum">--%</span>
            <span class="det-sub">Vochtigheid</span>
          </div>
        </div>
        <div class="det">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h9a2.5 2.5 0 1 1-2.5 2.5"/>
          </svg>
          <div>
            <span class="det-val" id="detWind">-- km/h</span>
            <span class="det-sub" id="detWindDir">--</span>
          </div>
        </div>
        <div class="det">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="13" r="7"/>
            <path d="M12 13l3-3M12 4v2"/>
          </svg>
          <div>
            <span class="det-val" id="detPres">-- hPa</span>
            <span class="det-sub">Luchtdruk</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="hourly" id="hourlyRow"></div>

  <!--<div class="daily" id="dailyRow"></div>  -->
  <div class="chartwrap" id="chartwrap">
    <svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

</div>

// <div class="tapfs" id="tapFs">Tik ergens om te starten<br><small style="opacity:.7">(en eventueel volledig scherm te openen)</small></div>


<script>
(function(){
  "use strict";

  // ---------- state & defaults ----------
  // var DEFAULTS = { name: "Nijverdal", lat: 52.3639, lon: 6.4628 };
  var loc = { name: "Nijverdal", lat: 52.3639, lon: 6.4628 };
  // var loc = loadLocation();
  // var loc = DEFAULTS;
  var lastGood = loadCache();
  var refreshTimer = null;
  
  // screen size, fullscreen laptop 1536 x 864, Samsung A6 tablet 1280 x 800
  var screenW = window.innerWidth;
  var screenH = window.innerHeight;

  function loadCache(){
    try{
      var raw = localStorage.getItem("ws_cache");
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }
  function saveCache(data){
    try{ localStorage.setItem("ws_cache", JSON.stringify(data)); }catch(e){}
  }

  // ---------- weather code -> description/icon ----------
  var WCODE = {
    0:["Heldere hemel","sun"], 1:["Overwegend helder","sun-cloud"], 2:["Half bewolkt","sun-cloud"],
    3:["Bewolkt","cloud"], 45:["Mist","fog"], 48:["Aanvriezende mist","fog"],
    51:["Lichte motregen","rain"], 53:["Motregen","rain"], 55:["Zware motregen","rain"],
    56:["Lichte ijzel","rain"], 57:["IJzel","rain"],
    61:["Lichte regen","rain"], 63:["Regen","rain"], 65:["Zware regen","rain"],
    66:["Lichte ijsregen","rain"], 67:["IJsregen","rain"],
    71:["Lichte sneeuw","snow"], 73:["Sneeuw","snow"], 75:["Zware sneeuw","snow"], 77:["Sneeuwkorrels","snow"],
    80:["Lichte buien","rain"], 81:["Buien","rain"], 82:["Zware buien","rain"],
    85:["Lichte sneeuwbuien","snow"], 86:["Zware sneeuwbuien","snow"],
    95:["Onweer","thunder"], 96:["Onweer met hagel","thunder"], 99:["Zwaar onweer met hagel","thunder"]
  };
  function wInfo(code, isDay){
    var e = WCODE[code] || ["Onbekend","cloud"];
    var kind = e[1];
    if(kind === "sun" && !isDay) kind = "moon";
    if(kind === "sun-cloud" && !isDay) kind = "cloud-moon";
    return { desc: e[0], kind: kind };
  }

  var ICONS = {
    "sun": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.6"/><path d="M12 1.5v3M12 19.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
    "moon": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>',
    "cloud": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 18a4.5 4.5 0 0 1-.5-8.98A5.5 5.5 0 0 1 16.4 8.1 4 4 0 0 1 17.5 16v0"/><path d="M6.5 18h11"/></svg>',
    "sun-cloud": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3.2"/><path d="M8 2.5v1.6M3 8h1.6M8 13.4v-1M3.6 4.6l1.1 1.1M12.4 4.6l-1.1 1.1"/><path d="M9.5 19a4.2 4.2 0 0 1-.4-8.38A5.1 5.1 0 0 1 18.7 9.4 3.7 3.7 0 0 1 19.7 16.6"/><path d="M9.5 19h9.2"/></svg>',
    "cloud-moon": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9.8 8.4A3.4 3.4 0 1 1 6 4.6a2.7 2.7 0 0 0 3.8 3.8z"/><path d="M9.5 19a4.2 4.2 0 0 1-.4-8.38A5.1 5.1 0 0 1 18.7 9.4 3.7 3.7 0 0 1 19.7 16.6"/><path d="M9.5 19h9.2"/></svg>',
    "rain": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 15.5a4.5 4.5 0 0 1-.5-8.98A5.5 5.5 0 0 1 16.4 7.6 4 4 0 0 1 17.5 15.5"/><path d="M8 18.5l-1 2.2M12 18.5l-1 2.2M16 18.5l-1 2.2"/></svg>',
    "snow": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 15.5a4.5 4.5 0 0 1-.5-8.98A5.5 5.5 0 0 1 16.4 7.6 4 4 0 0 1 17.5 15.5"/><path d="M8 18v3M8 18l-1.6 1M8 18l1.6 1M12 18v3M12 18l-1.6 1M12 18l1.6 1M16 18v3M16 18l-1.6 1M16 18l1.6 1"/></svg>',
    "fog": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 12a4.5 4.5 0 0 1-.5-8.98A5.5 5.5 0 0 1 16.4 4.1 4 4 0 0 1 17.5 11"/><path d="M3.5 15h17M3.5 18.5h17M3.5 21.5h13"/></svg>',
    "thunder": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 13.5a4.5 4.5 0 0 1-.5-8.98A5.5 5.5 0 0 1 16.4 5.1 4 4 0 0 1 17.5 13"/><path d="M12.5 14.5l-3 4.5h2.6l-1.6 3.5 4.4-5.5h-2.6z"/></svg>'
  };
  function iconSvg(kind){ return ICONS[kind] || ICONS.cloud; }

  var DIRS = ["N","NNO","NO","ONO","O","OZO","ZO","ZZO","Z","ZZW","ZW","WZW","W","WNW","NW","NNW"];
  function windDir(deg){ return DIRS[Math.round(deg/22.5) % 16]; }

  // thermal color scale: interpolate hex colors across temperature stops
  var STOPS = [[-10,"#3E6FE0"], [0,"#4FA8E0"], [10,"#7FC4FF"], [18,"#F5D76E"], [25,"#F5B942"], [32,"#FF8A5B"], [40,"#E0524A"]];
  function hexToRgb(h){
    h=h.replace("#",""); 
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
  function rgbToHex(r,g,b){ 
    function h(n){ 
      n=Math.max(0,Math.min(255,Math.round(n))).toString(16); 
      return n.length<2?"0"+n:n; 
      } 
    return "#"+h(r)+h(g)+h(b); 
    }
  function tempColor(t){
    if(t <= STOPS[0][0]) return STOPS[0][1];
    if(t >= STOPS[STOPS.length-1][0]) return STOPS[STOPS.length-1][1];
    for(var i=0;i<STOPS.length-1;i++){
      var a = STOPS[i], b = STOPS[i+1];
      if(t >= a[0] && t <= b[0]){
        var f = (t-a[0])/(b[0]-a[0]);
        var ca = hexToRgb(a[1]), cb = hexToRgb(b[1]);
        return rgbToHex(ca[0]+(cb[0]-ca[0])*f, ca[1]+(cb[1]-ca[1])*f, ca[2]+(cb[2]-ca[2])*f);
      }
    }
    return "#F5B942";
  }

  var DROPLET_PATH = 'M12 2s7 8.5 7 13a7 7 0 1 1-14 0c0-4.5 7-13 7-13z';

  function dropletsFilled(pop){
    if(pop >= 71) return 3;
    if(pop >= 41) return 2;
    if(pop >= 15) return 1;
    return 0;
  }

  // the color of the sunshine rect
  var SUN_LOW = [0xFB,0xF3,0xC7], SUN_HIGH = [0xFF,0xC3,0x00];
  function sunColor(pct){
    pct = Math.max(0, Math.min(100, pct)) / 100;
    var r = SUN_LOW[0] + (SUN_HIGH[0]-SUN_LOW[0])*pct;
    var g = SUN_LOW[1] + (SUN_HIGH[1]-SUN_LOW[1])*pct;
    var b = SUN_LOW[2] + (SUN_HIGH[2]-SUN_LOW[2])*pct;
    return rgbToHex(r,g,b);
  }

  // the color of the wind arrow
  var WIND_LOW = [0x93,0xA2,0xBE], WIND_HIGH = [0xFF,0x8A,0x5B]; // #93A2BE is grey, #FF8A5B is orange
  function windColor(speed){
    var pct = Math.max(0, Math.min(50, speed)) / 50;
    var r = WIND_LOW[0] + (WIND_HIGH[0]-WIND_LOW[0])*pct;
    var g = WIND_LOW[1] + (WIND_HIGH[1]-WIND_LOW[1])*pct;
    var b = WIND_LOW[2] + (WIND_HIGH[2]-WIND_LOW[2])*pct;
    return rgbToHex(r,g,b);
  }
  
  // the width of the wind arrow
  function windStrokeWidth(speed){
    if(speed >= 40) return 20;
    if(speed >= 30) return 15;
    if(speed >= 20) return 10;
    if(speed >= 15) return 8;
    if(speed >= 10) return 6;
    if(speed >=  5) return 4;
    return 2;
  }

  function svgEl(tag, attrs){
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(var k in attrs){ el.setAttribute(k, attrs[k]); }
    return el;
  }
  function svgTxt (attrs, text){
    var el = svgEl("text", attrs);
        el.textContent = text;
        return el;
  }
  
  // ---------- clock ----------
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  var DAGEN = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
  var MAANDEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
  function tickClock(){
    var now = new Date();
    document.getElementById("clock").innerHTML = pad(now.getHours()) + "<span>:</span>" + pad(now.getMinutes());
    document.getElementById("dateStr").textContent = DAGEN[now.getDay()] + " " + now.getDate() + " " + MAANDEN[now.getMonth()];
  }

  // ---------- rendering ----------
  function fmtTime(iso){
    var d = new Date(iso);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtHour(iso){
    var d = new Date(iso);
    return pad(d.getHours()) + ":00";
  }
  function round(n){ return Math.round(n); }

  function setBackground(isDay, kind){
    var body = document.body;
    if(isDay){
      if(kind === "sun") { body.style.setProperty("--bg-a", "#2E86D6"); body.style.setProperty("--bg-b", "#8FD3F4"); }
      else if(kind === "rain" || kind === "thunder") { body.style.setProperty("--bg-a", "#3A4459"); body.style.setProperty("--bg-b", "#5C6B84"); }
      else { body.style.setProperty("--bg-a", "#4F7EA6"); body.style.setProperty("--bg-b", "#A9C4D6"); }
      document.getElementById("stars").style.opacity = 0;
    } else {
      body.style.setProperty("--bg-a", "#0B1220");
      body.style.setProperty("--bg-b", "#1B2A4A");
      document.getElementById("stars").style.opacity = 1;
    }
  }

  function renderArc(current, daily){
    var now = new Date();
    var sunrise = new Date(daily.sunrise[0]);
    var sunset = new Date(daily.sunset[0]);
    var isDay = current.is_day === 1;
    var t;
    if(isDay){
      t = (now - sunrise) / (sunset - sunrise);
    } else {
      var prevSunset, nextSunrise;
      if(now < sunrise){
        prevSunset = new Date(daily.sunset[daily.sunset.length > 1 ? daily.sunrise.length - 1 : 0]);
        // yesterday's sunset not in data; approximate using today's sunrise minus 16h
        prevSunset = new Date(sunrise.getTime() - 16*3600*1000);
        nextSunrise = sunrise;
      } else {
        prevSunset = sunset;
        nextSunrise = new Date(daily.sunrise[1] || (sunset.getTime() + 14*3600*1000));
      }
      t = (now - prevSunset) / (nextSunrise - prevSunset);
    }
    t = Math.max(0, Math.min(1, t));
    var angle = Math.PI - t*Math.PI;
    var cx = 150 + 130*Math.cos(angle);
    var cy = 140 - 130*Math.sin(angle);
    var dot = document.getElementById("arcDot");
    dot.setAttribute("cx", cx.toFixed(1));
    dot.setAttribute("cy", cy.toFixed(1));
    dot.setAttribute("fill", isDay ? "#F5B942" : "#C9D6F0");

    document.getElementById("sunriseT").textContent = fmtTime(daily.sunrise[0]);
    document.getElementById("sunsetT").textContent = fmtTime(daily.sunset[0]);
    document.getElementById("arcLabel").textContent = isDay ? "daglicht — " + round(t*100) + "%" : "nacht — " + round(t*100) + "%";
  }

  function renderCurrent(current){
    var isDay = current.is_day === 1;
    var info = wInfo(current.weather_code, isDay);
    setBackground(isDay, info.kind);
    document.getElementById("curIcon").innerHTML = iconSvg(info.kind);
    document.getElementById("curTemp").innerHTML = round(current.temperature_2m) + "<sup>°C</sup>";
    document.getElementById("curDesc").textContent = info.desc;
    document.getElementById("curFeels").textContent = "Voelt als " + round(current.apparent_temperature) + "°C";
    document.getElementById("detHum").textContent = round(current.relative_humidity_2m) + "%";
    document.getElementById("detWind").textContent = round(current.wind_speed_10m) + " km/h";
    document.getElementById("detWindDir").textContent = windDir(current.wind_direction_10m);
    document.getElementById("detPres").textContent = round(current.pressure_msl) + " hPa";
  }

  function renderHourly(hourly){
    var now = new Date();
    var startIdx = 0;
    for(var i=0;i<hourly.time.length;i++){
      if(new Date(hourly.time[i]) >= now){ startIdx = i; break; }
    }
    var html = "";
    for(var j=startIdx; j<Math.min(startIdx+14, hourly.time.length); j++){
      var kind = wInfo(hourly.weather_code[j], 1).kind;
      html += '<div class="hr">' +
        '<div class="hr-t">' + fmtHour(hourly.time[j]) + '</div>' +
        '<div class="hr-icon">' + iconSvg(kind) + '</div>' +
        '<div class="hr-temp">' + round(hourly.temperature_2m[j]) + '°</div>' +
        '<div class="hr-pop">' + round(hourly.precipitation_probability[j]) + '%</div>' +
        '</div>';
    }
    document.getElementById("hourlyRow").innerHTML = html;
  }

  function renderDaily(daily){
    var n = Math.min(14, daily.time.length); // nr of days, max 14
    var minMarginW = 20;  // screen width laptop is 1536, tablet 1280, so diffgerent colW and marginW
    var colW = Math.floor((screenW-minMarginW-minMarginW)/n);
    var marginW = Math.floor((screenW-n*colW)/2);
    var marginTop = 0;
    var sunTop = marginTop, sunW = colW-2;
    var iconTop = marginTop, iconSize = colW/2;
    var dropTop = iconTop + iconSize, dropSize = 15;
    var windSize = 40, windY = dropTop + dropSize + windSize/2; // windY is center of arrow
    var sunH = iconSize + dropSize + windSize;
    var barTop = marginTop + sunH; 
    var barHeight = 150; // orig 150
    var barBottom = barTop + barHeight;
    var dayLabelY = barBottom + 16;
    var dateLabelY = dayLabelY + 16;
    var totalH = dateLabelY + 14;
    var totalW = marginW + n*colW + marginW;



    var tmax = daily.temperature_2m_max;
    var tmin = daily.temperature_2m_min;
    var gMax = Math.max.apply(null, tmax.slice(0,n)) + 10; // orig +3
    var gMin = Math.min.apply(null, tmin.slice(0,n)) - 10; // orig -3
    function tempToY(t){ return barTop + (gMax - t) / (gMax - gMin) * (barBottom - barTop); }

    var svg = document.getElementById("chart");
    svg.setAttribute("viewBox", "0 0 " + totalW + " " + totalH);
    //svg.setAttribute("width", totalW);
    //svg.setAttribute("height", totalH);
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", "100%");
    svg.innerHTML = "";

    // diagnostics
    // svg.appendChild(svgTxt({x:marginW, y:10, "text-anchor":"left", "font-size":15, "font-weight":600, "fill":"#93A2BE"}, "screenW="+screenW+" colW="+colW+" marginW="+marginW+" totalW="+totalW));
    // svg.appendChild(svgEl("line", {x1:marginW, y1:windY, x2:marginW+150, y2:windY, stroke:"rgba(127,0,0,1)", "stroke-width":3, "stroke-dasharray":"4,5"}));
    svg.appendChild(svgEl("rect", {x:0, y:0, width:totalW, height:totalH, rx:3, stroke:"yellow", opacity:"0.85", fill:"none", "stroke-width":"3"}));
    // svg.appendChild(svgEl("rect", {x:marginW, y:barTop, width:n*colW, height:barBottom - barTop, rx:3, stroke:"red", opacity:"0.85", fill:"none", "stroke-width":"3"}));

    // faint gridlines across the temperature area
    for(var t=-30; t<50; t=t+10){
      if(t>=gMin && t<=gMax){
        var gy = tempToY (t);
        svg.appendChild(svgEl("line", {x1:marginW+5, y1:gy, x2:totalW-marginW, y2:gy, stroke:"rgba(181,185,189,0.5)", "stroke-width":1, "stroke-dasharray":"4,5"}));
        svg.appendChild(svgTxt({x:marginW-10, y:gy+5, "text-anchor":"middle", "font-size":15, "font-weight":600, "fill":"#93A2BE"}, t));
        }
      }

    // walk the days
    var maxPts = [], minPts = [];
    for(var i=0;i<n;i++){
      var cx = marginW + i*colW + colW/2;
      var d = new Date(daily.time[i]);
      var info = wInfo(daily.weather_code[i]);
      var maxY = tempToY(tmax[i]);
      var minY = tempToY(tmin[i]);
      var col = tempColor(tmax[i]);
      var colLo = tempColor(tmin[i]);
      
      // sun-chance rect: brightness of yellow reflects share of daylight with sunshine, start at sunTop
      var sunPct = 0;
      if(daily.daylight_duration && daily.daylight_duration[i] > 0){
        sunPct = Math.round(100 * (daily.sunshine_duration[i] || 0) / daily.daylight_duration[i]);
      }
      svg.appendChild(svgEl("rect", {x:cx-sunW/2, y:sunTop, width:sunW, height:sunH, rx:3, fill:sunColor(sunPct)}));
      // var sunLbl = svgEl("text", {x:cx, y:sunLabelY, "text-anchor":"middle", "font-size":10});
      // sunLbl.setAttribute("fill", "#93A2BE");
      // sunLbl.textContent = sunPct + "%";
      // svg.appendChild(sunLbl);
      
      // icons, start at iconTop
      var isvg = svgEl("svg", {x:cx-iconSize/2, y:iconTop, width:iconSize, height:iconSize, viewBox:"0 0 24 24", fill:"none", stroke:"#000000", "stroke-width":1.6});
      isvg.innerHTML = ICONS[info[1]] || ICONS["cloud"];
      svg.appendChild(isvg);


      // rain-chance droplet indicator (3 droplets, filled count = level of rain chance), start at dropTop
      var pop = daily.precipitation_probability_max[i] || 0;
      var filled = dropletsFilled(pop);
      for(var dsp=0; dsp<3; dsp++){ // 3 droplets
        var dx = cx + (dsp-1)*dropSize - dropSize/2; 
        var isFilled = dsp < filled;
        var dsvg = svgEl("svg", {x:dx, y:dropTop, width:dropSize, height:dropSize, viewBox:"0 0 24 24",
          fill: isFilled ? "#0530F0" : "none", // org 7FC4FF
          stroke: isFilled ? "#0530F0" : "rgba(5,48,240,0.55)", // org 147,162,190,0.55
          "stroke-width":1.6});
        dsvg.innerHTML = '<path d="' + DROPLET_PATH + '"/>';
        svg.appendChild(dsvg);
      }
      
      // wind arrow: rotation shows where the wind blows to, thickness/size shows strength, center is windY, height=windSize=24
      var windSpeed = (daily.wind_speed_10m_max && daily.wind_speed_10m_max[i]) || 0;
      var windDir = (daily.wind_direction_10m_dominant && daily.wind_direction_10m_dominant[i]) || 0;
      // var wCol = windColor(windSpeed);
      var wCol = "black";
      var wW = windStrokeWidth(windSpeed); // pijl-lijn is 2 tot 8 breed
      // var headHalf = wW*1.5 + 3; // wat heeft de breedte van de pijl te maken met de lijn breedte?
      // var headHalf = windSize/4;
      var rotation = windDir + 180; // "from" direction -> arrow points where the wind is going
      var wg = svgEl("g", {transform:"rotate(" + rotation + " " + cx + " " + windY + ")"});
      wg.appendChild(svgEl("line", {x1:cx, y1:windY+windSize/2-4, x2:cx, y2:windY-windSize/2+8, stroke:wCol, "stroke-width":wW, "stroke-linecap":"round"}));
      wg.appendChild(svgEl("polygon", {points: (cx-windSize/4)+","+(windY-15)+" "+(cx+windSize/4)+","+(windY-15)+" "+cx+","+(windY-windSize/2), fill:wCol}));
      svg.appendChild(wg);
      // svg.appendChild(svgTxt({x:cx, y:windY+24, "text-anchor":"middle", "font-size":15, "font-weight":600}, Math.round(windSpeed) + " km/h"));
      // svg.appendChild(svgEl("circle", {cx:cx, cy:windY, r:4.5, fill:"#C9D6F0"}));
      // svg.appendChild(svgEl("circle", {cx:cx, cy:windY, r:windSize/2, fill:"none", stroke:"#0530F0", "stroke-width":1.6}));
      
      // temp range bar with dots on the end, starting at barTop
      svg.appendChild(svgEl("line", {x1:cx, y1:maxY, x2:cx, y2:minY, stroke:col, "stroke-width":7, "stroke-linecap":"round", opacity:"0.9"}));
      svg.appendChild(svgEl("circle", {cx:cx, cy:maxY, r:4.5, fill:col}));
      svg.appendChild(svgEl("circle", {cx:cx, cy:minY, r:4.5, fill:"#C9D6F0"}));

      // max/min value labels
      // var maxLbl = svgEl("text", {x:cx, y:maxLabelY, "text-anchor":"middle", "font-size":15, "font-weight":600});
      // var maxLbl = svgEl("text", {x:cx, y:maxY-10, "text-anchor":"middle", "font-size":15, "font-weight":600});
      // maxLbl.setAttribute("class","daylabel");
      // maxLbl.textContent = Math.round(tmax[i]) + "°";
      // maxLbl.setAttribute("fill", col);
      // svg.appendChild(maxLbl);
      svg.appendChild(svgTxt({x:cx, y:maxY-10, "text-anchor":"middle", "font-size":15, "font-weight":600}, Math.round(tmax[i]) + "°"));

      // var minLbl = svgEl("text", {x:cx, y:minLabelY, "text-anchor":"middle", "font-size":13});
      // var minLbl = svgEl("text", {x:cx, y:minY+20, "text-anchor":"middle", "font-size":13});
      // minLbl.textContent = Math.round(tmin[i]) + "°";
      // minLbl.setAttribute("fill", "#93A2BE");
      // svg.appendChild(minLbl);
      svg.appendChild(svgTxt({x:cx, y:minY+20, "text-anchor":"middle", "font-size":15, "font-weight":600}, Math.round(tmin[i]) + "°"));

      // trend lines between dots will be drawn later
      maxPts.push(cx + "," + maxY);
      minPts.push(cx + "," + minY);

      // background color of the weekend day
      if(DAGEN[d.getDay()] === "za" || DAGEN[d.getDay()] === "zo"){
        svg.appendChild(svgEl("rect", {x:cx-colW/2, y:dayLabelY-10, width:colW, height:40, rx:3, fill:"black"}));
      }
      
      // day + date label
      var dayLbl = svgEl("text", {x:cx, y:dayLabelY, "text-anchor":"middle", "font-size":15});
      dayLbl.setAttribute("class","daylabel");
      dayLbl.textContent = i === 0 ? "Vandaag" : DAGEN[d.getDay()];
      svg.appendChild(dayLbl);

      var dateLbl = svgEl("text", {x:cx, y:dateLabelY, "text-anchor":"middle", "font-size":15});
      dateLbl.setAttribute("class","datelabel");
      dateLbl.textContent = d.getDate() + " " + MAANDEN[d.getMonth()];
      svg.appendChild(dateLbl);
    }

    // trend lines connecting the tops and bottoms across days
    svg.appendChild(svgEl("polyline", {points:maxPts.join(" "), fill:"none", stroke:"rgba(245,185,66,0.35)", "stroke-width":1.5}));
    svg.appendChild(svgEl("polyline", {points:minPts.join(" "), fill:"none", stroke:"rgba(201,214,240,0.28)", "stroke-width":1.5}));
    // move trend lines behind bars
    svg.insertBefore(svg.lastChild, svg.firstChild);
    svg.insertBefore(svg.lastChild, svg.firstChild);
  }

  function renderAll(data){
    document.getElementById("placeName").textContent = loc.name;
    document.getElementById("coords").textContent = Number(loc.lat).toFixed(2) + "°N " + Number(loc.lon).toFixed(2) + "°O";
    renderCurrent(data.current);
    renderArc(data.current, data.daily);
    renderHourly(data.hourly);
    renderDaily(data.daily);
  }

    var els = document.getElementById("updatedText");
    var eld = document.getElementById("updatedDate");

  // ---------- fetch ----------
  function fetchWeather(){
    var url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + encodeURIComponent(loc.lat) +
      "&longitude=" + encodeURIComponent(loc.lon) +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,is_day" +
      "&hourly=temperature_2m,weather_code,precipitation_probability" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,sunshine_duration,daylight_duration,wind_speed_10m_max,wind_direction_10m_dominant" +
      "&timezone=auto&forecast_days=14";


    fetch(url).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(data){
      renderAll(data);
      saveCache(data);
      setUpdated(true);
    }).catch(function(err){
      console.error("Weerdata ophalen mislukt:", err);
      if(lastGood){
        renderAll(lastGood);
      }
      setUpdated(false);
    });
  }

  // ---------- starfield (very light, low-power) ----------
  function initStars(){
    var c = document.getElementById("stars");
    var ctx = c.getContext("2d");
    var stars = [];
    function resize(){
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      stars = [];
      var n = Math.floor((c.width*c.height)/22000);
      for(var i=0;i<n;i++){
        stars.push({x: Math.random()*c.width, y: Math.random()*c.height*0.7, r: Math.random()*1.4+0.3, a: Math.random()});
      }
    }
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      for(var i=0;i<stars.length;i++){
        var s = stars[i];
        s.a += (Math.random()-0.5)*0.02;
        if(s.a<0.15) s.a=0.15; if(s.a>1) s.a=1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, 6.283);
        ctx.fillStyle = "rgba(244,247,250," + s.a + ")";
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    window.addEventListener("resize", resize);
    resize();
    draw();
  }

  function requestWakeLock(){
    if("wakeLock" in navigator){
      navigator.wakeLock.request("screen").catch(function(){});
    }
  }
  document.addEventListener("visibilitychange", function(){

  });

  tickClock();
  setInterval(tickClock, 1000);
  initStars();
  fetchWeather();
  setInterval(fetchWeather, 10*60*1000); // elke 10 minuten
  requestWakeLock();
