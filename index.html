<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1220">
<title>Weerstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220;   /* deep, near-black blue, commonly known as Chinese Black or an "Arabian Nights" dark navy */
    --cloud:#F4F7FA; /* very light, desaturated blue-gray often called Alice Blue or "Porcelain White" */
    --muted:#93A2BE; /* dusty, unsaturated shade of light blue */
    --gold:#F5B942;  /* bright, warm neon-style yellow-orange with a cream-like tone */
    --coral:#FF8A5B; /* vibrant, light orange often referred to as "Glossy Coral" or a warm, mellow peach */
    --red:#FF0000;
    --green:#00FF00;
    --line: rgba(244,247,250,0.16);  /* off-white/light gray with an alpha transparency of 16% */
    --panel: rgba(244,247,250,0.06); /* off-white/light gray with an alpha transparency of 6% */
    --bg-a: #0B1220;
    --bg-b: #1B2A4A;
    --transition-bg: background 1.4s ease;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
    transition: var(--transition-bg);
    color: var(--cloud); font-family:'Inter', system-ui, sans-serif;
  }
  #stars{position:fixed; inset:0; z-index:0; opacity:0; transition:opacity 1.4s ease; pointer-events:none;}
/*
  .app{
    position:relative; z-index:1;
    height:100%; width:100%;
    display:flex; flex-direction:column;
    padding: 3.2vh 3.4vw 2vh 3.4vw;
  }
*/
  .app{ min-height:100vh; display:flex; flex-direction:column; gap:2vh; padding: 2vh 2vw; }
  .panelbox{ background:var(--panel); border:1px solid var(--line); border-radius:14px; }

  /* ---------- topbar ---------- */
  .topbar{
    flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px; padding: 16px 22px;
  }
  .place{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: clamp(16px, 1.8vw, 24px);}
  .place small{display:block; font-family:'IBM Plex Mono', monospace; font-weight:400;
    font-size: clamp(10px,1vw,13px); color: var(--cloud); letter-spacing:.06em; margin-top:2px;}
  .clockwrap{text-align:right;}
  .clock{
    font-family:'IBM Plex Mono', monospace; font-weight:500; 
    font-size: clamp(24px, 3vw, 40px); line-height:1;
  }
  .clock span{color:var(--gold);}
  .date{
    font-family:'Inter'; font-size: clamp(16px,2vw,24px); 
    color:var(--cloud); margin-top:3px; text-transform:capitalize;
  }
  
  .updated{
    font-family:'IBM Plex Mono'; font-size:clamp(16px, 2vw, 24px); color:var(--green);
    text-align:center;
    }
  .updated.offline{color:var(--red);}

  .btn-group {
    top: 16px; right: 16px; display: flex; gap: 8px;
  }
  .icon-btn {
    width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center;
    background: #eee; border: none; cursor: pointer; padding: 0;
  }
  .icon-btn:hover {
    background: #ddd;
  }
  .icon-btn svg {
    width: 18px; height: 18px; stroke: #333;
  }
/*
  .iconbtn{
    flex:0 0 auto; width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:rgba(244,247,250,0.05); color:var(--cloud); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .iconbtn svg{width:18px; height:18px;}
*/

  /* ---------- middle ---------- */
  .middle{ flex:1; display:flex; gap:2vw; flex-wrap:wrap; min-height:0; align-items:stretch; }
  .left{ flex:1 1 65%; min-width:340px; display:flex; flex-direction:column; gap:2vh; }
  .right{ flex:0 0 30%; min-width:260px; }

  /* current row: arc + current details */
  .current-row{ padding: 20px 24px; display:flex; align-items:center; gap:3vw; flex-wrap:wrap; }
  .arcbox{flex:0 0 auto; width:min(240px, 34vw); display:flex; flex-direction:column; align-items:center;}
  .arcbox svg{width:100%; height:auto; overflow:visible;}
  .arc-times{display:flex; justify-content:space-between; width:88%; margin-top:-4px;
    font-family:'IBM Plex Mono', monospace; font-size:clamp(10px,1vw,13px); color:var(--cloud);}
  .arc-label{font-family:'Inter'; font-size:clamp(10px,0.9vw,12px); color:var(--cloud); margin-top:8px; letter-spacing:.04em;}

  .current{flex:1; min-width:220px; display:flex; align-items:center; gap:2.4vw; flex-wrap:wrap;}
  .cur-icon{flex:0 0 auto; width:clamp(56px,6vw,88px); height:clamp(56px,6vw,88px); color:var(--gold);margin-right: auto; margin-left: auto;}
  .cur-desc{font-family:'Space Grotesk'; font-weight:500; font-size:clamp(14px,1.4vw,18px); margin-top:2px;}
  .cur-main{min-width:0;}
  .cur-temp{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: clamp(40px, 5.4vw, 76px); line-height:1; display:flex; align-items:flex-start;}
  .cur-temp sup{font-size:.35em; font-weight:500; margin-top:.15em; color:var(--cloud);}
  .cur-feels{font-family:'Inter'; font-size:clamp(11px,1vw,13px); color:var(--cloud); margin-top:2px;}

  .cur-wind{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px;}
  .cur-wind svg{width:clamp(34px,3.6vw,48px); height:clamp(48px,5vw,68px);}
  .cur-wind-speed{font-family:'IBM Plex Mono'; font-size:clamp(11px,1vw,13px); color:var(--cloud);}
  
  .details{flex:0 0 auto; display:grid; grid-template-columns:1fr; gap:8px; min-width:10px;}
  .det{display:flex; align-items:center; gap:8px;}
  .det svg{width:16px; height:16px; color:var(--cloud); flex:0 0 auto;}
  

  /* hourly row */
  .hourly-box{ padding: 16px 18px; flex:1; min-height:0; }
  .hourly{ display:flex; gap:16px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .hourly::-webkit-scrollbar{height:0;}
  .hr{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:46px;}
  .hr-t{font-family:'IBM Plex Mono'; font-size:11px; color:var(--cloud);}
  .hr-icon{width:22px; height:22px; color:var(--cloud); opacity:.85;}
  .hr-temp{font-family:'Space Grotesk'; font-weight:600; font-size:14px;}
  .hr-pop{font-family:'IBM Plex Mono'; font-size:10px; color:var(--cloud);}

  /* right: iframe */
  .right{ display:flex; flex-direction:column; padding: 16px; gap:10px; }
 /* .right h4{ margin:0; font-family:'Space Grotesk'; font-size:12px; font-weight:600; color:var(--cloud); text-transform:uppercase; letter-spacing:.06em; } */
  .iframe-wrap{ position:relative; flex:1; min-height:200px; height:200px; border-radius:10px; overflow:hidden; background:#0e1a30; border:1px solid var(--line); }
  .iframe-wrap iframe{ width:100%; height:100%; border:0; display:block; }
/*
  .iframe-placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    padding: 20px; font-family:'Inter'; font-size:12.5px; color:var(--cloud); line-height:1.6;
  }
  .iframe-placeholder.hide{display:none;}
*/
  /* footer: 14-day chart */
  .footer{ flex:0 0 auto; padding: 16px 6px 12px 6px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .footer h4{ margin:0 0 4px 18px; font-family:'Space Grotesk'; font-size:12px; font-weight:600; color:var(--cloud); text-transform:uppercase; letter-spacing:.06em; }
  svg#dailyChart text{font-family:'IBM Plex Mono', monospace; fill:var(--cloud);}
  svg#dailyChart .daylabel{font-family:'Space Grotesk', sans-serif; font-weight:600; fill:var(--cloud);}
  svg#dailyChart .datelabel{fill:var(--cloud); font-size:11px;}
/*
  .updated{font-family:'IBM Plex Mono'; font-size:11px; color:var(--cloud); padding: 0 18px;}
  .updated.offline{color:var(--coral);}
*/
  @media (max-width: 900px){
    .middle{ flex-direction:column; }
    .right{ flex:0 0 auto; max-width:none; }
    .iframe-wrap{ min-height:260px; }
  }

  /* ---------- settings overlay ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:5; display:none; align-items:center; justify-content:center;}
  .overlay.show{display:flex;}
  .panel{background:#101a30; border:1px solid var(--line); border-radius:18px; padding:24px 26px; width:min(92vw, 420px); font-family:'Inter';}
  .panel h3{font-family:'Space Grotesk'; margin:0 0 14px 0; font-size:18px;}
  .panel label{display:block; font-size:12px; color:var(--cloud); margin:14px 0 4px;}
  .panel input{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#0B1220; color:var(--cloud); font-family:'IBM Plex Mono'; font-size:13px;}
  .panel-btns{display:flex; gap:10px; margin-top:20px;}
  .btn{flex:1; padding:10px; border-radius:9px; border:none; font-family:'Space Grotesk'; font-weight:600; cursor:pointer; font-size:14px;}
  .btn.primary{background:var(--gold); color:#1a1300;}
  .btn.ghost{background:transparent; color:var(--cloud); border:1px solid var(--line);}
  .hint{font-size:11px; color:var(--cloud); margin-top:14px; line-height:1.5;}
</style>
</head>

  function loadCache(){
    try{
      var raw = localStorage.getItem("ws_cache");
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }
  function saveCache(data){
    try{ localStorage.setItem("ws_cache", JSON.stringify(data)); }catch(e){}
  }

  // ================= weercodes & iconen =================
  var WCODE = {
    0:["Heldere hemel","sun"], 1:["Overwegend helder","sun-cloud"], 2:["Half bewolkt","sun-cloud"],
    3:["Bewolkt","cloud"], 45:["Mist","fog"], 48:["Aanvriezende mist","fog"],
    51:["Lichte motregen","rain"], 53:["Motregen","rain"], 55:["Zware motregen","rain"],
    56:["Lichte ijzel","rain"], 57:["IJzel","rain"],
    61:["Lichte regen","rain"], 63:["Regen","rain"], 65:["Zware regen","rain"],
    66:["Lichte ijsregen","rain"], 67:["IJsregen","rain"],
    71:["Lichte sneeuw","snow"], 73:["Sneeuw","snow"], 75:["Zware sneeuw","snow"], 77:["Sneeuwkorrels","snow"],
    80:["Lichte buien","rain"], 81:["Buien","rain"], 82:["Zware buien","rain"],
    85:["Lichte sneeuwbuien","snow"], 86:["Zware sneeuwbuien","snow"],
    95:["Onweer","thunder"], 96:["Onweer met hagel","thunder"], 99:["Zwaar onweer","thunder"]
  };
  function wInfo(code, isDay){
    var e = WCODE[code] || ["Onbekend","cloud"];
    var kind = e[1];
    if(kind === "sun" && isDay === 0) kind = "moon";
    if(kind === "sun-cloud" && isDay === 0) kind = "cloud-moon";
    return { desc: e[0], kind: kind };
  }
  // volledige <svg>-iconen (voor current/hourly, los in een div geplaatst)

  function rgbToHex(r,g,b){ function h(n){ n=Math.max(0,Math.min(255,Math.round(n))).toString(16); return n.length<2?"0"+n:n; } return "#"+h(r)+h(g)+h(b); }

  var TEMP_STOPS = [[-10,"#3E6FE0"], [0,"#4FA8E0"], [10,"#7FC4FF"], [18,"#F5D76E"], [25,"#F5B942"], [32,"#FF8A5B"], [40,"#E0524A"]];
  function tempColor(t){
    if(t <= TEMP_STOPS[0][0]) return TEMP_STOPS[0][1];

    for(var i=0;i<TEMP_STOPS.length-1;i++){
      var a=TEMP_STOPS[i], b=TEMP_STOPS[i+1];
      if(t>=a[0] && t<=b[0]){
        var f=(t-a[0])/(b[0]-a[0]);
        var ca=hexToRgb(a[1]), cb=hexToRgb(b[1]);
        return rgbToHex(ca[0]+(cb[0]-ca[0])*f, ca[1]+(cb[1]-ca[1])*f, ca[2]+(cb[2]-ca[2])*f);

  function setBackground(isDay, kind){
    var body = document.body;
    if(isDay){
      if(kind === "sun") { 
        body.style.setProperty("--bg-a", "#2E86D6"); body.style.setProperty("--bg-b", "#8FD3F4"); 
      }
      else if(kind === "rain" || kind === "thunder") { 
        body.style.setProperty("--bg-a", "#3A4459"); body.style.setProperty("--bg-b", "#5C6B84"); 
      }
      else { 
        body.style.setProperty("--bg-a", "#4F7EA6"); body.style.setProperty("--bg-b", "#A9C4D6"); 
      }
      document.getElementById("stars").style.opacity = 0;
    } else {
      body.style.setProperty("--bg-a", "#0B1220");
      body.style.setProperty("--bg-b", "#1B2A4A");
      document.getElementById("stars").style.opacity = 1;
    }
  }

  function renderArc(current, daily){
    var now = new Date();
    var sunrise = new Date(daily.sunrise[0]);
    var sunset = new Date(daily.sunset[0]);
    var isDay = current.is_day === 1;
    var t;
    if(isDay){
      t = (now - sunrise) / (sunset - sunrise);
    } else {
      var prevSunset, nextSunrise;
      if(now < sunrise){
        prevSunset = new Date(sunrise.getTime() - 16*3600*1000);
        nextSunrise = sunrise;
      } else {
        prevSunset = sunset;
        nextSunrise = new Date(daily.sunrise[1] || (sunset.getTime() + 14*3600*1000));
      }
      t = (now - prevSunset) / (nextSunrise - prevSunset);
    }
    t = Math.max(0, Math.min(1, t));
    var angle = Math.PI - t*Math.PI;
    var cx = 150 + 130*Math.cos(angle);
    var cy = 140 - 130*Math.sin(angle);
    var dot = document.getElementById("arcDot");
    dot.setAttribute("cx", cx.toFixed(1));
    dot.setAttribute("cy", cy.toFixed(1));
    dot.setAttribute("fill", isDay ? "#F5B942" : "#C9D6F0");
    document.getElementById("sunriseT").textContent = fmtTime(daily.sunrise[0]);
    document.getElementById("sunsetT").textContent = fmtTime(daily.sunset[0]);
    document.getElementById("arcLabel").textContent = isDay ? "daglicht "+round(t*100)+"%" : "nacht "+round(t*100)+"%";
  }

  function renderCurrent(current){
    var isDay = current.is_day;
    var info = wInfo(current.weather_code, isDay);
    setBackground(isDay===1, info.kind);
    document.getElementById("curIcon").innerHTML = ICONS_FULL[info.kind] || ICONS_FULL.cloud;
    document.getElementById("curTemp").innerHTML = round(current.temperature_2m) + "<sup>°C</sup>";
    document.getElementById("curFeels").textContent = "Voelt als " + round(current.apparent_temperature) + "°C";
    document.getElementById("curDesc").textContent = info.desc;
    //document.getElementById("detWind").textContent = round(current.wind_speed_10m) + " km/h";
    document.getElementById("detHum").textContent = round(current.relative_humidity_2m) + "%";
    //document.getElementById("detWindDir").textContent = windDir(current.wind_direction_10m);
    document.getElementById("detPres").textContent = round(current.pressure_msl) + " hPa";

    // windpijl naast de temperatuur: richting = rotatie, sterkte = dikte/kleur
    var wSpeed = current.wind_speed_10m || 0;
    var wDir = current.wind_direction_10m || 0;
    //var wCol = windColor(wSpeed);
    var wCol = "#F4F7FA";
    var wW = windStrokeWidth(wSpeed) * 1.3;
    var headHalf = wW*1.4 + 3;
    var rotation = wDir + 180; // "komt uit" -> pijl wijst waar de wind naartoe waait
    var arrowSvg = document.getElementById("curWindArrow");
    arrowSvg.innerHTML =
      '<g transform="rotate(' + rotation + ' 20 30)">' +
      '<line x1="20" y1="46" x2="20" y2="16" stroke="' + wCol + '" stroke-width="' + wW + '" stroke-linecap="round"/>' +
      '<polygon points="' + (20-headHalf) + ',20 ' + (20+headHalf) + ',20 20,6" fill="' + wCol + '"/>' +
      '</g>';
    document.getElementById("curWindSpeed").textContent = round(wSpeed) + " km/h";
  }
  
  function renderHourly(hourly){
    var now = new Date();
    var startIdx = 0;
    for(var i=0;i<hourly.time.length;i++){ if(new Date(hourly.time[i]) >= now){ startIdx = i; break; } }
    var html = "";
    for(var j=startIdx; j<Math.min(startIdx+16, hourly.time.length); j++){
      var kind = wInfo(hourly.weather_code[j], 1).kind;
      html += '<div class="hr">'+
        '<div class="hr-t">'+fmtHour(hourly.time[j])+'</div>'+
        '<div class="hr-icon">'+ICONS_FULL[kind]+'</div>'+
        '<div class="hr-temp">'+round(hourly.temperature_2m[j])+'°</div>'+
        '<div class="hr-pop">'+round(hourly.precipitation_probability[j])+'%</div>'+
        '</div>';
    }
    document.getElementById("hourlyRow").innerHTML = html;
  }

    function tempToY(t){ return barTop + (gMax - t) / (gMax - gMin) * (barBottom - barTop); }

    var svg = document.getElementById("chart");
    svg.setAttribute("viewBox", "0 0 " + totalW + " " + totalH);
    //svg.setAttribute("width", totalW);
    //svg.setAttribute("height", totalH);
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", "100%");
    svg.innerHTML = "";

    // diagnostics
    // svg.appendChild(svgTxt({x:marginW+100, y:barTop+20, "text-anchor":"left", "font-size":15, "font-weight":600, "fill":"#000000"}, "iconSize="+iconSize+" colW="+colW+" marginW="+marginW+" windX="+windX));
    // svg.appendChild(svgEl("line", {x1:marginW, y1:windY, x2:marginW+150, y2:windY, stroke:"rgba(127,0,0,1)", "stroke-width":3, "stroke-dasharray":"4,5"}));
    // svg.appendChild(svgEl("rect", {x:0, y:0, width:totalW, height:totalH, rx:3, stroke:"yellow", opacity:"0.85", fill:"none", "stroke-width":"3"}));
    // svg.appendChild(svgEl("rect", {x:marginW, y:barTop, width:n*colW, height:barBottom - barTop, rx:3, stroke:"red", opacity:"0.85", fill:"none", "stroke-width":"3"}));

    // faint gridlines across the temperature area
    for(var t=-30; t<50; t=t+10){
      if(t>=gMin && t<=gMax){
        var gy = tempToY (t);
        svg.appendChild(svgEl("line", {x1:marginW+5, y1:gy, x2:totalW-marginW, y2:gy, stroke:"rgba(181,185,189,0.9)", "stroke-width":1, "stroke-dasharray":"4,5"}));
        svg.appendChild(svgTxt({x:marginW-10, y:gy+5, "text-anchor":"middle", "font-size":15, "font-weight":600, "fill":"#FFFFFF"}, t));
      }
    }


    // walk the days
    var maxPts = [], minPts = [];
    for(var i=0;i<n;i++){
      var dayLeft = marginW + i*colW;
      var cx = marginW + i*colW + colW/2; // horizontal center of the sun rectangle of this day
      var d = new Date(daily.time[i]);
      var info = wInfo(daily.weather_code[i]);
      var maxY = tempToY(tmax[i]);
      var minY = tempToY(tmin[i]);
      var col = tempColor(tmax[i]);
      var colLo = tempColor(tmin[i]);

      // sun-chance rect: brightness of yellow reflects share of daylight with sunshine, start at sunTop
      var sunPct = 0;
      if(daily.daylight_duration && daily.daylight_duration[i] > 0){
        sunPct = Math.round(100 * (daily.sunshine_duration[i] || 0) / daily.daylight_duration[i]);
      }
      svg.appendChild(svgEl("rect", {x:cx-sunW/2, y:sunTop, width:sunW, height:sunH, rx:3, fill:sunColor(sunPct)}));
      // var sunLbl = svgEl("text", {x:cx, y:sunLabelY, "text-anchor":"middle", "font-size":10});
      // sunLbl.setAttribute("fill", "#93A2BE");
      // sunLbl.textContent = sunPct + "%";
      // svg.appendChild(sunLbl);
      
      // weather kind icon, start at iconX,iconTop
      var isvg = svgEl("svg", {x:cx-sunW/2+iconX, y:iconTop, width:iconSize, height:iconSize, viewBox:"0 0 24 24", fill:"none", stroke:"#000000", "stroke-width":1.6});
      // isvg.innerHTML = ICONS[info[1]] || ICONS["cloud"];
      isvg.innerHTML = ICONS_INNER[info.kind] || ICONS_INNER.cloud;
      svg.appendChild(isvg);


      // rain-chance droplet indicator (3 droplets, filled count = level of rain chance), start at dropTop
      var pop = daily.precipitation_probability_max[i] || 0;
      var filled = dropletsFilled(pop);
      for(var dsp=0; dsp<3; dsp++){ // 3 droplets
        // var dx = cx + (dsp-1)*dropSize - dropSize/2; 
        var dx = cx - colW/2 + dsp * dropSize;
        var isFilled = dsp < filled;
        var dsvg = svgEl("svg", {x:dx, y:dropTop, width:dropSize, height:dropSize, viewBox:"0 0 24 24",
          fill: isFilled ? "#0530F0" : "none", // org 7FC4FF
          stroke: isFilled ? "#0530F0" : "rgba(5,48,240,0.55)", // org 147,162,190,0.55
          "stroke-width":1.6});
        dsvg.innerHTML = '<path d="' + DROPLET_PATH + '"/>';
        svg.appendChild(dsvg);
      }
      
      // wind arrow: rotation shows where the wind blows to, thickness/size shows strength, center is windX,windY, height=windSize=24
      var windSpeed = (daily.wind_speed_10m_max && daily.wind_speed_10m_max[i]) || 0;
      var windDir = (daily.wind_direction_10m_dominant && daily.wind_direction_10m_dominant[i]) || 0;
      // var wCol = windColor(windSpeed);
      var wCol = "black";
      var wW = windStrokeWidth(windSpeed); // pijl-lijn is 2 tot 8 breed
      var windCX = dayLeft+windLeft+windSize/2;
      var windCY = windTop+windSize/2;
      var rotation = windDir + 180; // "from" direction -> arrow points where the wind is going
      // var rotation = 0;
      var wg = svgEl("g", {transform:"rotate(" + rotation + " " + (windCX) + " " + windCY + ")"});
      wg.appendChild(svgEl("line", {x1:windCX, y1:windCY+windSize/2-4, x2:windCX, y2:windCY-windSize/2+8, stroke:wCol, "stroke-width":wW, "stroke-linecap":"round"}));
      // wg.appendChild(svgEl("line", {x1:windCX, y1:windCY-10, x2:windCX, y2:windCY+10, stroke:"red", "stroke-width":2, "stroke-linecap":"round"}));
      // wg.appendChild(svgEl("line", {x1:windCX-10, y1:windCY, x2:windCX+10, y2:windCY, stroke:"red", "stroke-width":2, "stroke-linecap":"round"}));
      wg.appendChild(svgEl("polygon", {points: (windCX-windSize/4)+","+(windCY)+" "+(windCX+windSize/4)+","+(windCY)+" "+(windCX)+","+(windCY-windSize/2), fill:wCol}));
      svg.appendChild(wg);
      // svg.appendChild(svgTxt({x:cx, y:windY+24, "text-anchor":"middle", "font-size":15, "font-weight":600}, Math.round(windSpeed) + " km/h"));
      // svg.appendChild(svgEl("circle", {cx:cx, cy:windY, r:4.5, fill:"#C9D6F0"}));
      // svg.appendChild(svgEl("circle", {cx:cx, cy:windY, r:windSize/2, fill:"none", stroke:"#0530F0", "stroke-width":1.6}));
      
      // svg.appendChild(svgTxt({x:marginW+100, y:barTop+20, "text-anchor":"left", "font-size":15, "font-weight":600, "fill":"#000000"}, "windCX="+windCX+" windCY="+windCY+" windSize="+windSize));
      // break;
      
      // temp range bar with dots on the end, starting at barTop
      svg.appendChild(svgEl("line", {x1:cx, y1:maxY, x2:cx, y2:minY, stroke:col, "stroke-width":7, "stroke-linecap":"round", opacity:"0.9"}));
      svg.appendChild(svgEl("circle", {cx:cx, cy:maxY, r:4.5, fill:col}));
      svg.appendChild(svgEl("circle", {cx:cx, cy:minY, r:4.5, fill:"#C9D6F0"}));

      // max/min value labels
      // var maxLbl = svgEl("text", {x:cx, y:maxLabelY, "text-anchor":"middle", "font-size":15, "font-weight":600});
      // var maxLbl = svgEl("text", {x:cx, y:maxY-10, "text-anchor":"middle", "font-size":15, "font-weight":600});
      // maxLbl.setAttribute("class","daylabel");
      // maxLbl.textContent = Math.round(tmax[i]) + "°";
      // maxLbl.setAttribute("fill", col);
      // svg.appendChild(maxLbl);
      svg.appendChild(svgTxt({x:cx, y:maxY-10, "text-anchor":"middle", "font-size":15, "font-weight":600}, Math.round(tmax[i]) + "°"));

      // var minLbl = svgEl("text", {x:cx, y:minLabelY, "text-anchor":"middle", "font-size":13});
      // var minLbl = svgEl("text", {x:cx, y:minY+20, "text-anchor":"middle", "font-size":13});
      // minLbl.textContent = Math.round(tmin[i]) + "°";
      // minLbl.setAttribute("fill", "#93A2BE");
      // svg.appendChild(minLbl);
      svg.appendChild(svgTxt({x:cx, y:minY+20, "text-anchor":"middle", "font-size":15, "font-weight":600}, Math.round(tmin[i]) + "°"));

      // trend lines between dots will be drawn later
      maxPts.push(cx + "," + maxY);
      minPts.push(cx + "," + minY);

      // background color of the weekend day
      if(DAGEN_KORT[d.getDay()] === "za" || DAGEN_KORT[d.getDay()] === "zo"){
        svg.appendChild(svgEl("rect", {x:cx-colW/2, y:dayLabelY-10, width:colW, height:40, rx:3, stroke:"yellow", opacity:"0.85", fill:"none", "stroke-width":"3"}));
      }
      
      // day + date label
      var dayLbl = svgEl("text", {x:cx, y:dayLabelY, "text-anchor":"middle", "font-size":15});
      dayLbl.setAttribute("class","daylabel");
      dayLbl.textContent = i === 0 ? "Vandaag" : DAGEN_KORT[d.getDay()];
      svg.appendChild(dayLbl);

      var dateLbl = svgEl("text", {x:cx, y:dateLabelY, "text-anchor":"middle", "font-size":15});
      dateLbl.setAttribute("class","datelabel");
      dateLbl.textContent = d.getDate() + " " + MAANDEN_KORT[d.getMonth()];
      svg.appendChild(dateLbl);
    }

    // trend lines connecting the tops and bottoms across days
    svg.appendChild(svgEl("polyline", {points:maxPts.join(" "), fill:"none", stroke:"rgba(245,185,66,0.35)", "stroke-width":1.5}));
    svg.appendChild(svgEl("polyline", {points:minPts.join(" "), fill:"none", stroke:"rgba(201,214,240,0.28)", "stroke-width":1.5}));
    // move trend lines behind bars
    svg.insertBefore(svg.lastChild, svg.firstChild);
    svg.insertBefore(svg.lastChild, svg.firstChild);

  }

  function renderAll(data){
    document.getElementById("placeName").textContent = loc.name;
    document.getElementById("coords").textContent = Number(loc.lat).toFixed(2)+"°N "+Number(loc.lon).toFixed(2)+"°O";
    renderCurrent(data.current);
    renderArc(data.current, data.daily);
    renderHourly(data.hourly);
    // buildDailyChart(data.daily);
    renderDaily(data.daily);
    // window.alert("renderAll gereed");

  function fetchWeather(){
    var url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + encodeURIComponent(loc.lat) +
      "&longitude=" + encodeURIComponent(loc.lon) +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,is_day" +
      "&hourly=temperature_2m,weather_code,precipitation_probability" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,sunshine_duration,daylight_duration,wind_speed_10m_max,wind_direction_10m_dominant" +
      "&timezone=auto&forecast_days=14";

    fetch(url).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(data){
        renderAll(data);
        saveCache(data);
        setUpdated(true);
      }).catch(function(err){
        console.error("Weerdata ophalen mislukt:", err);
        if(lastGood) renderAll(lastGood);
        setUpdated(false);
      });
  }

  // ---------- starfield (very light, low-power) ----------
  function initStars(){
    var c = document.getElementById("stars");
    var ctx = c.getContext("2d");
    var stars = [];
    function resize(){
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      stars = [];
      var n = Math.floor((c.width*c.height)/22000);
      for(var i=0;i<n;i++){
        stars.push({x: Math.random()*c.width, y: Math.random()*c.height*0.7, r: Math.random()*1.4+0.3, a: Math.random()});
      }
    }
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      for(var i=0;i<stars.length;i++){
        var s = stars[i];
        s.a += (Math.random()-0.5)*0.02;
        if(s.a<0.15) s.a=0.15; if(s.a>1) s.a=1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, 6.283);
        ctx.fillStyle = "rgba(244,247,250," + s.a + ")";
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    window.addEventListener("resize", resize);
    resize();
    draw();
  }

  // keep screen awake where supported (Chrome 84+); silently ignored on older WebView
  function requestWakeLock(){
    if("wakeLock" in navigator){
      navigator.wakeLock.request("screen").catch(function(){});
